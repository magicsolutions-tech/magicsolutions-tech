<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Languages: no public code yet" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<title>Languages: no public code yet</title>
<style>
.c{animation:in .8s cubic-bezier(.16,1,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.s{transform-origin:left center;animation:grow 1.4s cubic-bezier(.4,0,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.l{animation:in .7s ease both}
.sh{animation:sh 2.6s ease-in-out infinite}@keyframes sh{0%,100%{opacity:.25}50%{opacity:.8}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9A88FF"/><stop offset="0.55" stop-color="#2FD0E4"/><stop offset="1" stop-color="#FFB347"/>
  </linearGradient></defs>
<g class="c"><rect x="0.5" y="0.5" width="999" height="189" rx="20" fill="#0C0E16" stroke="rgba(255,255,255,0.10)"/>
<text x="28" y="40" font-size="13" font-weight="600" fill="#AEB4C8" letter-spacing="1.5">LANGUAGES ACROSS OUR PUBLIC CODE</text></g><rect class="sh" x="28" y="62" width="944" height="16" rx="8" fill="url(#g)"/>
<text x="28" y="118" font-size="17" fill="#FFFFFF" font-weight="600">Public code is on its way.</text>
<text x="28" y="144" font-size="14" fill="#AEB4C8">When we open-source a project, its language mix appears here automatically.</text>
</svg>
