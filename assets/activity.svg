<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="138" viewBox="0 0 1000 138" role="img" aria-label="Recent public activity" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<title>Recent public activity</title>
<style>
.c{animation:in .8s cubic-bezier(.16,1,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.r{animation:slide .7s cubic-bezier(.16,1,.3,1) both}
@keyframes slide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.live{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9A88FF"/><stop offset="0.55" stop-color="#2FD0E4"/><stop offset="1" stop-color="#FFB347"/>
  </linearGradient></defs>
<g class="c"><rect x="0.5" y="0.5" width="999" height="137" rx="20" fill="#0C0E16" stroke="rgba(255,255,255,0.10)"/>
<circle class="live" style="transform-origin:34px 38px" cx="34" cy="38" r="5" fill="#3DDC97"/>
<text x="52" y="43" font-size="13" font-weight="600" fill="#AEB4C8" letter-spacing="1.5">RECENT ACTIVITY</text></g><text x="28" y="98" font-size="17" font-weight="600" fill="#FFFFFF">No public activity yet.</text>
<text x="28" y="122" font-size="14" fill="#AEB4C8">New commits, pull requests and releases will appear here automatically.</text>
</svg>
