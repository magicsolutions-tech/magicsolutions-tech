# OPTIONAL and for a PERSONAL account only (organisations have no contribution graph).
# Not tested here. To use it: move this file to .github/workflows/snake.yml, run it once from the Actions tab, then add this
# line to README.md where you want the snake:
#   <p align="center"><img src="https://raw.githubusercontent.com/magicsolutions-tech/magicsolutions-tech/output/github-snake-dark.svg" alt="Contribution snake" width="100%"></p>
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
